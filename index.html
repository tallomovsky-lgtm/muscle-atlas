*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  font-size:15px;line-height:1.45;overflow:hidden;height:100dvh;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{position:relative;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(145deg,var(--sel-a),var(--sel-b));display:grid;place-items:center;box-shadow:0 4px 14px var(--glow)}
.logo svg{width:20px;height:20px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-2px}
.langBtn{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.langBtn svg{width:15px;height:15px;opacity:.7}

/* ---------- views ---------- */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.view.on{opacity:1;pointer-events:auto}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 24px}

/* segmented */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:var(--surface3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--surface3)}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- map view ---------- */
.mapControls{flex:none;padding:4px 16px 0;display:flex;flex-direction:column;gap:10px}
.stage{flex:1;min-height:0;position:relative;perspective:1400px;touch-action:pan-y;cursor:grab}
.stage::before{content:"";position:absolute;inset:6% 8%;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent 75%);pointer-events:none}
.stage::after{content:"";position:absolute;left:22%;right:22%;bottom:3%;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);pointer-events:none}
.flipper{position:absolute;inset:6px 0 10px;transform-style:preserve-3d;will-change:transform}
.flipper.snap{transition:transform .55s cubic-bezier(.22,.9,.3,1)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face svg{height:100%;width:auto;max-width:94vw;display:block;overflow:visible}
.sil{fill:url(#gSkin);stroke:none}
.sil-line{fill:none;stroke:var(--skin-line);stroke-width:1.3;stroke-linecap:round}
.m{cursor:pointer;outline:none}
.m:focus-visible path:not(.fiber){stroke:var(--accent);stroke-width:2}
.m path{fill:url(#gMus);stroke:var(--mus-line);stroke-width:.8;transition:fill .2s,filter .25s,opacity .2s}
.m .fiber{fill:none;stroke:var(--fiber);stroke-width:.9;opacity:.6;pointer-events:none}
.m.sel path{fill:url(#gSel);stroke:var(--sel-b);filter:drop-shadow(0 0 6px var(--glow))}
.m.sel .fiber{fill:none;stroke:rgba(255,255,255,.55)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.78}}
.m.sel path.pp{animation:pulse 1.6s ease-in-out infinite}
@media (hover:hover){.m:hover path:not(.fiber){fill:url(#gHov)}}
.mapHint{flex:none;text-align:center;font-size:12.5px;color:var(--muted);padding:0 16px 8px;display:flex;align-items:center;justify-content:center;gap:8px}
.mapHint b{color:var(--ink2);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sideTag{position:absolute;top:8px;inset-inline-start:16px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}

/* ---------- tab bar ---------- */
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}

/* ---------- lists ---------- */
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin:4px 0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;-webkit-user-select:text;user-select:text}
.secHead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.secHead h3{margin:0;font-size:17px;font-weight:750;letter-spacing:-.01em}
.secHead span{font-size:12px;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;text-align:start}
.row:active{transform:scale(.985)}
.eqIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.eqIcon svg{width:22px;height:22px}
.t0{color:var(--eq0);background:var(--eq0-bg)}.t1{color:var(--eq1);background:var(--eq1-bg)}.t2{color:var(--eq2);background:var(--eq2-bg)}
.rowMain{flex:1;min-width:0}
.rowMain b{display:block;font-size:15px;font-weight:650;line-height:1.25}
.rowMain span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
[dir="rtl"] .chev{transform:scaleX(-1)}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:start}
.mcard b{font-size:14.5px}
.mcard span{font-size:11.5px;color:var(--muted);font-style:italic}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:76%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(105%);transition:transform .38s cubic-bezier(.22,.9,.3,1)}
.sheet.on{transform:none}
.grab{flex:none;display:flex;justify-content:center;padding:10px 0 4px}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--surface3)}
.sheetHead{flex:none;display:flex;align-items:flex-start;gap:12px;padding:4px 18px 12px}
.sheetHead .nm{flex:1;min-width:0}
.sheetHead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sheetHead .lat{font-size:13px;color:var(--accent);font-style:italic;margin-top:2px}
.sheetHead .wh{font-size:13px;color:var(--muted);margin-top:2px}
.xBtn{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.xBtn svg{width:16px;height:16px;color:var(--muted)}
.sheetChips{flex:none;padding:0 18px 10px}
.sheetBody{overflow-y:auto;padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 18px);overscroll-behavior:contain}

/* ---------- exercise page ---------- */
.page{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.22,.9,.3,1)}
[dir="rtl"] .page{transform:translateX(-100%)}
.page.on{transform:none}
.pageTop{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px}
.iconBtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none}
.iconBtn svg{width:20px;height:20px}
[dir="rtl"] .backIco{transform:scaleX(-1)}
.pageTop .ttl{flex:1;text-align:center;font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn.fav.on{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.iconBtn.fav.on svg path{fill:currentColor}
.pageBody{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 120px;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}

.hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--line);position:relative;overflow:hidden}

.heroTxt{flex:1;min-width:0;position:relative;z-index:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{padding:12px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;direction:ltr}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}

.instrHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 12px}

.tipCard{margin-top:12px;display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}

.cta button svg{width:22px;height:22px}
.cta button:active{transform:scale(.98)}

/* ---------- timer ---------- */
.timer{position:absolute;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .25s}
.timer.on{opacity:1;pointer-events:auto}

.ring{position:relative;width:240px;height:240px}

.timer .tbtns{display:flex;gap:12px;direction:ltr}
.timer .tbtns button{height:48px;min-width:84px;padding:0 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:700;direction:ltr}
.timer .tbtns button.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.timer.done .num{color:var(--accent)}

/* ---------- install hint ---------- */
.install{margin:14px 0 4px;padding:14px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);font-size:13.5px;color:var(--ink2);display:none;gap:12px;align-items:flex-start}

.install svg{width:22px;height:22px;flex:none;color:var(--accent)}
.install b{color:var(--ink)}
.install .x{margin-inline-start:auto;color:var(--muted);font-size:18px;line-height:1}

@media (prefers-reduced-motion: reduce){
  .flipper.snap,.sheet,.page{transition-duration:.15s}
  .m.sel path.pp{animation:none}
}
@media (min-height:760px){.heroTxt h2{font-size:25px}}

/* ---------- timer ---------- */
let tTotal=60,tLeft=60,tEnd=0,tInt=null;const C=2*Math.PI*52;
$('tmArc').style.strokeDasharray=C;
function tDraw(){const s=Math.max(0,Math.ceil(tLeft));$('tmNum').textContent=s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s;$('tmArc').style.strokeDashoffset=C*(1-Math.max(0,tLeft)/tTotal)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.18);o.connect(g).connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2)})}catch(_){}}
function tTick(){tLeft=(tEnd-Date.now())/1000;if(tLeft<=0){tLeft=0;clearInterval(tInt);tInt=null;$('timer').classList.add('done');$('tmLbl').textContent=L().timeUp;$('tmDone').textContent=L().done;beep();if(navigator.vibrate)navigator.vibrate([200,100,200])}tDraw()}
function tStart(sec){tTotal=sec;tEnd=Date.now()+sec*1000;tLeft=sec;$('timer').classList.remove('done');$('tmLbl').textContent=L().restLbl;$('tmDone').textContent=L().skip;$('timer').classList.add('on');tDraw();clearInterval(tInt);tInt=setInterval(tTick,200)}
function tAdd(d){if(!tInt)return;tEnd+=d*1000;tTotal=Math.max(tTotal+(d>0?d:0),1);tTick()}
$('pgTimer').onclick=()=>{if(curEx)tStart(byId[curEx.mid].ex[curEx.i].rest)};
$('tmPlus').onclick=()=>tAdd(15);$('tmMinus').onclick=()=>tAdd(-15);
$('tmDone').onclick=()=>{clearInterval(tInt);tInt=null;$('timer').classList.remove('on')};

/* ---------- library ---------- */
function norm(s){return String(s).toLowerCase()}
function renderLib(){
  const q=norm($('q').value.trim());
  let html='',total=0;
  const order=[...FRONT_IDS,...BACK_IDS];
  if(!q&&filt==='all'){
    html+=`<div class="secHead"><h3>${esc(L().allMuscles)}</h3></div><div class="mgrid">`+order.map(id=>`<button class="mcard" data-goto="${id}"><b>${esc(byId[id][lang].name)}</b><span>${LATIN[id]}</span></button>`).join('')+`</div>`;
  }
  order.forEach(id=>{
    const m=byId[id];
    const mHit=!q||[m.en.name,m.he.name,LATIN[id]].some(s=>norm(s).includes(q));
    const list=exList(m).filter(o=>mHit||[o.e.en.name,o.e.he.name].some(s=>norm(s).includes(q)));
    if(!list.length)return;total+=list.length;
    html+=`<div class="secHead"><h3>${esc(m[lang].name)}</h3><span>${LATIN[id]}</span></div>`+list.map(o=>rowHTML(o,false)).join('');
  });
  if(!total)html=`<div class="empty"><b>${esc(L().noResults)}</b></div>`;
  $('libList').innerHTML=html;
}
$('q').addEventListener('input',renderLib);

/* ---------- saved ---------- */
function renderSaved(){
  $('savedTitle').textContent=L().saved;
  const items=[...favs].map(k=>{const [mid,i]=k.split(':');const m=byId[mid];return m&&m.ex[+i]?{m,e:m.ex[+i],i:+i}:null}).filter(Boolean);
  $('savedCount').textContent=items.length?L().exCount(items.length):'';
  $('savedList').innerHTML=items.length?items.map(o=>rowHTML(o,true)).join(''):`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg><b>${esc(L().noSaved)}</b>${esc(L().noSavedSub)}</div>`;
  const standalone=(window.navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches;
  const ic=$('installCard');
  if(!standalone&&!store.get('hideInstall',false)){ic.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/></svg><div>${L().install}</div><button class="x" id="hideInstall" aria-label="Hide">×</button>`;ic.classList.add('on');$('hideInstall').onclick=()=>{store.set('hideInstall',true);ic.classList.remove('on')}}else ic.classList.remove('on');
}

/* ---------- tabs ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;
  $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));
  if(view!=='map')closeSheet();
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.dir=lang==='he'?'rtl':'ltr';
  $('appTitle').textContent=lang==='he'?'אטלס השרירים':'Muscle Atlas';
  $('appSub').textContent=L().sub;$('langLbl').textContent=lang==='he'?'EN':'עב';
  const sb=$('sideSeg').querySelectorAll('button');sb[0].textContent=L().front;sb[1].textContent=L().back;
  $('mapHint').innerHTML=L().hint;
  const tb=$('tabs').querySelectorAll('button span');tb[0].textContent=L().tabMap;tb[1].textContent=L().tabLib;tb[2].textContent=L().tabSaved;
  $('q').placeholder=L().search;
  renderChips();renderLib();renderSaved();
  if(curMuscle)renderSheet();if(curEx)renderPage();
}
$('langBtn').onclick=()=>{lang=lang==='he'?'en':'he';store.set('lang',lang);applyLang()};

document.querySelectorAll('#stage .m').forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMuscle(g.dataset.m)}}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('timer').classList.contains('on'))$('tmDone').click();else if(curEx)closePage();else closeSheet()}});

applyRot();applyLang();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body></html>
