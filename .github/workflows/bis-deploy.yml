# Deploys the Bis recognition server (nutrition/server/worker.js) to Cloudflare Workers
# and checks that the live server runs the new version.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
name: Bis server deploy
on:
  push:
    branches: [main]
    paths: ['nutrition/server/**', '.github/workflows/bis-deploy.yml']
  workflow_dispatch:
    inputs:
      live_test:
        description: 'Also run one real recognition (about 1 cent)'
        type: boolean
        default: false
concurrency: bis-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c051b4feac0ce2e664e7e24319398c28
      SERVER: https://bis.tallomovsky.workers.dev
      ORIGIN: https://tallomovsky-lgtm.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          npx --yes wrangler@4 whoami
      - name: Find or create the KV namespace for counters and the key
        id: kv
        run: |
          npx --yes wrangler@4 kv namespace list > kv.json
          ID=$(jq -r '[.[] | select(.title=="bis-limits")][0].id // empty' kv.json)
          if [ -z "$ID" ]; then
            echo "No bis-limits namespace yet, creating it"
            npx --yes wrangler@4 kv namespace create bis-limits
            npx --yes wrangler@4 kv namespace list > kv.json
            ID=$(jq -r '[.[] | select(.title=="bis-limits")][0].id // empty' kv.json)
          fi
          test -n "$ID"
          echo "KV namespace: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Deploy the worker
        working-directory: nutrition/server
        run: |
          cat > wrangler.toml <<TOML
          name = "bis"
          main = "worker.js"
          compatibility_date = "2025-09-01"
          workers_dev = true
          keep_vars = true

          [[kv_namespaces]]
          binding = "LIMITS"
          id = "${{ steps.kv.outputs.id }}"
          TOML
          cat wrangler.toml
          npx --yes wrangler@4 deploy
      - name: Verify the live server runs this version
        run: |
          WANT=$(grep -oE 'const VERSION = [0-9]+' nutrition/server/worker.js | grep -oE '[0-9]+$')
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS -m 20 "$SERVER/?device=ghdeploy001" || true)
            echo "$BODY"
            GOT=$(echo "$BODY" | jq -r '.version // 0' 2>/dev/null || echo 0)
            if [ "$GOT" = "$WANT" ]; then echo "Live server is version $GOT"; exit 0; fi
            sleep 5
          done
          echo "::error::Live server reports version $GOT, expected $WANT"
          exit 1
      - name: Real recognition test
        if: ${{ inputs.live_test }}
        run: |
          curl -sS -m 120 -w '\nHTTP %{http_code}  time %{time_total}s\n' -X POST \
            -H "Origin: $ORIGIN" -H "content-type: application/json" \
            --data '{"desc":"ביצה קשה אחת ופרוסת לחם","device":"ghdeploy001"}' "$SERVER/analyze" | tee out.txt
          grep -q '"items"' out.txt
